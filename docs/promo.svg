<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" xml:space="preserve"><title>rahyab promo animation</title><desc>A 20-second looping terminal animation: pip and npm fail, the rahyab logo appears, rahyab fix races three mirrors, skips a fast but outdated one, picks a fresh one, then installs succeed.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#e6edf3}
.d{fill:#8b949e}.g{fill:#3fb950}.r{fill:#f85149}.y{fill:#d29922}.b{fill:#58a6ff}.sm{font-size:12px}.md{font-size:14px}
.an{animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:linear}.f{opacity:0}
.gx{transform-box:fill-box;transform-origin:0 50%;animation-timing-function:ease-out}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@keyframes s1{0%,1%{opacity:0}2%,24%{opacity:1}25%,100%{opacity:0}}@keyframes s2{0%,40%{opacity:0}41%,75%{opacity:1}76%,100%{opacity:0}}@keyframes s3{0%,76%{opacity:0}77%,89%{opacity:1}90%,100%{opacity:0}}
@keyframes a1{0%,2%{opacity:0}3%,24%{opacity:1}25%,100%{opacity:0}}@keyframes a2{0%,10%{opacity:0}11%,24%{opacity:1}25%,100%{opacity:0}}@keyframes a3{0%,13%{opacity:0}14%,24%{opacity:1}25%,100%{opacity:0}}@keyframes a4{0%,16%{opacity:0}17%,24%{opacity:1}25%,100%{opacity:0}}@keyframes a5{0%,21%{opacity:0}22%,24%{opacity:1}25%,100%{opacity:0}}
@keyframes t1{0%,3%{transform:translateX(0)}9%,100%{transform:translateX(180px)}}@keyframes k1{0%,10%{opacity:1}10.5%,100%{opacity:0}}
@keyframes t4{0%,17%{transform:translateX(0)}20%,100%{transform:translateX(99px)}}@keyframes k4{0%,21%{opacity:1}21.5%,100%{opacity:0}}
@keyframes lg{0%,25%{opacity:0}26.5%,39%{opacity:1}40.5%,100%{opacity:0}}
@keyframes nd{0%,26%{transform:rotate(-270deg)}32%{transform:rotate(18deg)}34.5%{transform:rotate(-6deg)}36%,100%{transform:rotate(0)}}
@keyframes lt{0%,28%{opacity:0;transform:translateY(14px)}31%,100%{opacity:1;transform:translateY(0)}}@keyframes lt2{0%,31%{opacity:0;transform:translateY(14px)}34%,100%{opacity:1;transform:translateY(0)}}
@keyframes b1{0%,40%{opacity:0}41%,75%{opacity:1}76%,100%{opacity:0}}@keyframes t5{0%,41%{transform:translateX(0)}45%,100%{transform:translateX(90px)}}@keyframes k5{0%,46%{opacity:1}46.5%,100%{opacity:0}}
@keyframes b2{0%,46.5%{opacity:0}47.5%,75%{opacity:1}76%,100%{opacity:0}}@keyframes rw{0%,49.5%{opacity:0}50.5%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes gI{0%,50.5%{transform:scaleX(0)}53%,100%{transform:scaleX(1)}}@keyframes gA{0%,50.5%{transform:scaleX(0)}56%,100%{transform:scaleX(1)}}@keyframes gO{0%,50.5%{transform:scaleX(0)}61%,100%{transform:scaleX(1)}}
@keyframes tI{0%,54%{opacity:0}55%,75%{opacity:1}76%,100%{opacity:0}}@keyframes tA{0%,57%{opacity:0}58%,75%{opacity:1}76%,100%{opacity:0}}@keyframes tO{0%,61.5%{opacity:0}62.5%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes cf{0%,64%{opacity:0}65%,75%{opacity:1}76%,100%{opacity:0}}@keyframes un{0%,67.5%{opacity:0}68.5%,75%{opacity:1}76%,100%{opacity:0}}@keyframes pk{0%,70.5%{opacity:0}71.5%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes c1{0%,76%{opacity:0}77%,89%{opacity:1}90%,100%{opacity:0}}@keyframes t6{0%,77%{transform:translateX(0)}81%,100%{transform:translateX(180px)}}@keyframes k6{0%,82%{opacity:1}82.5%,100%{opacity:0}}
@keyframes c2{0%,82.5%{opacity:0}83.5%,89%{opacity:1}90%,100%{opacity:0}}@keyframes c3{0%,85%{opacity:0}86%,89%{opacity:1}90%,100%{opacity:0}}@keyframes c4{0%,86.5%{opacity:0}87.5%,89%{opacity:1}90%,100%{opacity:0}}
@keyframes ou{0%,89.5%{opacity:0}91%,98.5%{opacity:1}100%{opacity:0}}@keyframes ot{0%,90%{opacity:0;transform:translateY(12px)}93%,100%{opacity:1;transform:translateY(0)}}
</style>
<rect x="20" y="20" width="640" height="360" rx="10" fill="#0d1117" stroke="#30363d"/>
<line x1="20" y1="58" x2="660" y2="58" stroke="#21262d"/>
<circle cx="42" cy="39" r="6" fill="#f85149"/><circle cx="62" cy="39" r="6" fill="#d29922"/><circle cx="82" cy="39" r="6" fill="#3fb950"/>
<text x="340" y="43" text-anchor="middle" class="d sm">~/project — zsh</text>
<text x="640" y="43" text-anchor="end" class="r sm f an" style="animation-name:s1">the problem</text>
<text x="640" y="43" text-anchor="end" class="b sm f an" style="animation-name:s2">the fix</text>
<text x="640" y="43" text-anchor="end" class="g sm f an" style="animation-name:s3">it just works</text>
<g class="f an" style="animation-name:a1"><text x="44" y="94" class="g">$</text><text x="62" y="94" textLength="180" lengthAdjust="spacingAndGlyphs">pip install requests</text><g class="an" style="animation-name:t1"><rect x="62" y="79" width="190" height="21" fill="#0d1117"/><rect class="an" x="62" y="80" width="9" height="18" fill="#e6edf3" style="animation-name:k1"/></g></g>
<text x="44" y="124" class="y f an" style="animation-name:a2">  Retrying... connection timed out</text>
<text x="44" y="152" class="r f an" style="animation-name:a3">ERROR: No matching distribution found</text>
<g class="f an" style="animation-name:a4"><text x="44" y="192" class="g">$</text><text x="62" y="192" textLength="99" lengthAdjust="spacingAndGlyphs">npm install</text><g class="an" style="animation-name:t4"><rect x="62" y="177" width="110" height="21" fill="#0d1117"/><rect class="an" x="62" y="178" width="9" height="18" fill="#e6edf3" style="animation-name:k4"/></g></g>
<text x="44" y="222" class="r f an" style="animation-name:a5">npm ERR! 403 Forbidden</text>
<g class="f an" style="animation-name:b1"><text x="44" y="94" class="g">$</text><text x="62" y="94" textLength="90" lengthAdjust="spacingAndGlyphs">rahyab fix</text><g class="an" style="animation-name:t5"><rect x="62" y="79" width="100" height="21" fill="#0d1117"/><rect class="an" x="62" y="80" width="9" height="18" fill="#e6edf3" style="animation-name:k5"/></g></g>
<text x="44" y="124" class="d md f an" style="animation-name:b2">testing 3 mirrors with real requests...</text>
<g class="f an" style="animation-name:rw">
<text x="62" y="160" class="md">IranServer</text><rect x="190" y="151" width="180" height="8" rx="4" fill="#21262d"/><rect class="an gx" x="190" y="151" width="45" height="8" rx="4" fill="#d29922" style="animation-name:gI"/>
<text x="62" y="190" class="md">ArvanCloud</text><rect x="190" y="181" width="180" height="8" rx="4" fill="#21262d"/><rect class="an gx" x="190" y="181" width="80" height="8" rx="4" fill="#3fb950" style="animation-name:gA"/>
<text x="62" y="220" class="md">official</text><rect x="190" y="211" width="180" height="8" rx="4" fill="#21262d"/><rect class="an gx" x="190" y="211" width="180" height="8" rx="4" fill="#f85149" style="animation-name:gO"/>
</g>
<text x="388" y="160" class="y md f an" style="animation-name:tI">fastest, 11 days old · skip</text>
<text x="388" y="190" class="g md f an" style="animation-name:tA">fresh, 2h ago · picked ✓</text>
<text x="388" y="220" class="r md f an" style="animation-name:tO">timeout</text>
<text x="44" y="262" class="f an" style="animation-name:cf"><tspan class="g">✓</tspan> pip  <tspan class="g">✓</tspan> npm  <tspan class="g">✓</tspan> go   configured</text>
<text x="44" y="292" class="d md f an" style="animation-name:un">undo anytime: <tspan class="b">rahyab undo</tspan></text>
<text x="44" y="340" class="b f an" style="animation-name:pk">fresh beats fast.</text>
<g class="f an" style="animation-name:c1"><text x="44" y="94" class="g">$</text><text x="62" y="94" textLength="180" lengthAdjust="spacingAndGlyphs">pip install requests</text><g class="an" style="animation-name:t6"><rect x="62" y="79" width="190" height="21" fill="#0d1117"/><rect class="an" x="62" y="80" width="9" height="18" fill="#e6edf3" style="animation-name:k6"/></g></g>
<text x="44" y="124" class="g f an" style="animation-name:c2">Successfully installed requests</text>
<text x="44" y="162" class="f an" style="animation-name:c3"><tspan class="g">$</tspan> npm install   <tspan class="g">✓ done</tspan></text>
<g class="f an" style="animation-name:c4"><text x="44" y="200" class="g">$</text><rect class="bl" x="62" y="186" width="9" height="18" fill="#e6edf3"/></g>
<g class="f an" style="animation-name:lg"><rect x="20" y="20" width="640" height="360" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="340" cy="130" r="42" fill="none" stroke="#58a6ff" stroke-width="3"/><line x1="340" y1="82" x2="340" y2="90" stroke="#58a6ff" stroke-width="3"/><line x1="340" y1="170" x2="340" y2="178" stroke="#58a6ff" stroke-width="3"/><line x1="292" y1="130" x2="300" y2="130" stroke="#58a6ff" stroke-width="3"/><line x1="380" y1="130" x2="388" y2="130" stroke="#58a6ff" stroke-width="3"/>
<g class="an" style="animation-name:nd;animation-timing-function:ease-out;transform-box:view-box;transform-origin:340px 130px"><polygon points="340,96 349,130 331,130" fill="#58a6ff"/><polygon points="340,164 349,130 331,130" fill="#e6edf3"/><circle cx="340" cy="130" r="3" fill="#0d1117"/></g>
<g class="an" style="animation-name:lt"><text x="340" y="232" text-anchor="middle" style="font-size:42px">rahyab</text></g>
<g class="an" style="animation-name:lt2"><text x="340" y="270" text-anchor="middle" class="b" style="font-size:16px">pip · npm · go · docker — working again in Iran</text><text x="340" y="300" text-anchor="middle" class="d md">one command. real tests. safe undo.</text></g></g>
<g class="f an" style="animation-name:ou"><rect x="20" y="20" width="640" height="360" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="340" cy="118" r="30" fill="none" stroke="#58a6ff" stroke-width="3"/><polygon points="340,94 347,118 333,118" fill="#58a6ff"/><polygon points="340,142 347,118 333,118" fill="#e6edf3"/>
<g class="an" style="animation-name:ot"><text x="340" y="196" text-anchor="middle" style="font-size:34px">rahyab</text><text x="340" y="232" text-anchor="middle" class="b" style="font-size:16px">github.com/Ali30mhi/rahyab</text><text x="340" y="264" text-anchor="middle" class="d md">single binary · Linux · macOS · Windows · MIT</text><rect x="268" y="290" width="144" height="32" rx="16" fill="none" stroke="#d29922"/><text x="340" y="311" text-anchor="middle" class="y md">★ star on GitHub</text></g></g>
</svg>
